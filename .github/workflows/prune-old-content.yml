name: Prune Aged AI Models & Decks Weekly

on:
  schedule:
    # Every Sunday at 02:00 UTC (07:30 IST), right before weekly Openings refresh
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 markdown pillow markupsafe

      - name: Prune AI Models (>45d) and Decks (>90d)
        run: python -m engine.prune_old_content

      - name: Rebuild static site
        run: python -m engine.run build

      - name: Commit and push pruned site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No aged AI Models articles or Decks to prune."
          else
            git commit -m "chore: prune AI Models (>45d) and Decks (>90d)"
            git push
          fi
